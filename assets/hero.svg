<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#07131f"/>
      <stop offset=".55" stop-color="#173a63"/>
      <stop offset=".85" stop-color="#c8622a"/>
      <stop offset="1" stop-color="#ff9a3c"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b4562"/>
      <stop offset="1" stop-color="#0d1c2d"/>
    </linearGradient>
    <linearGradient id="steel2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b3049"/>
      <stop offset="1" stop-color="#08121d"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffb35c" stop-opacity=".9"/>
      <stop offset="1" stop-color="#ff7a12" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="800" fill="url(#sky)"/>
  <circle cx="1150" cy="560" r="260" fill="url(#glow)"/>
  <!-- far buildings -->
  <g fill="url(#steel2)">
    <rect x="0" y="520" width="260" height="280"/>
    <rect x="260" y="480" width="180" height="320"/>
    <rect x="440" y="540" width="300" height="260"/>
    <rect x="900" y="500" width="220" height="300"/>
    <rect x="1300" y="520" width="300" height="280"/>
  </g>
  <!-- main shop with sawtooth roof -->
  <g fill="url(#steel)">
    <path d="M520 800V470l90-60v60l90-60v60l90-60v60l90-60v60l90-60v60l90-60v60l90-60v60V800z"/>
    <rect x="1240" y="380" width="70" height="420"/>
    <rect x="1330" y="330" width="56" height="470"/>
  </g>
  <!-- smokestacks -->
  <g fill="#10233a">
    <rect x="1255" y="300" width="40" height="120"/>
    <rect x="1343" y="240" width="30" height="130"/>
  </g>
  <g fill="#ff8a24">
    <rect x="1255" y="300" width="40" height="8"/>
    <rect x="1343" y="240" width="30" height="8"/>
  </g>
  <g fill="#9fb3c8" opacity=".25">
    <ellipse cx="1280" cy="260" rx="50" ry="26"/>
    <ellipse cx="1330" cy="215" rx="70" ry="30"/>
    <ellipse cx="1390" cy="160" rx="90" ry="34"/>
  </g>
  <!-- lit windows -->
  <g fill="#ffb35c">
    <rect x="560" y="560" width="26" height="18"/><rect x="610" y="560" width="26" height="18"/>
    <rect x="700" y="560" width="26" height="18"/><rect x="790" y="560" width="26" height="18"/>
    <rect x="880" y="560" width="26" height="18"/><rect x="970" y="560" width="26" height="18"/>
    <rect x="1060" y="560" width="26" height="18"/><rect x="1150" y="560" width="26" height="18"/>
    <rect x="590" y="620" width="26" height="18"/><rect x="740" y="620" width="26" height="18"/>
    <rect x="920" y="620" width="26" height="18"/><rect x="1100" y="620" width="26" height="18"/>
  </g>
  <!-- gantry crane -->
  <g stroke="#0a1726" stroke-width="10" fill="none">
    <path d="M300 800V380M700 800V380M250 380H760"/>
  </g>
  <g stroke="#ff8a24" stroke-width="4"><path d="M500 380V520"/></g>
  <rect x="480" y="520" width="40" height="28" fill="#ff8a24"/>
  <!-- cable reels -->
  <g>
    <g transform="translate(180 740)">
      <ellipse rx="70" ry="70" fill="#0d1c2d"/><ellipse rx="46" ry="46" fill="#244566"/>
      <ellipse rx="14" ry="14" fill="#ff8a24"/>
    </g>
    <g transform="translate(410 760)">
      <ellipse rx="52" ry="52" fill="#0d1c2d"/><ellipse rx="34" ry="34" fill="#244566"/>
      <ellipse rx="10" ry="10" fill="#ff8a24"/>
    </g>
  </g>
  <rect y="772" width="1600" height="28" fill="#060e17"/>
</svg>
